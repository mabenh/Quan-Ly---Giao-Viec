name: Build

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
    inputs:
      api_url:
        description: 'Địa chỉ API mà app Android gọi tới (vd: https://api.congty.vn/api/v1)'
        required: false
        default: ''

env:
  NODE_VERSION: '22'
  # Ưu tiên: input khi chạy tay -> biến repo API_URL (Settings > Secrets and variables > Actions > Variables)
  API_URL: ${{ github.event.inputs.api_url || vars.API_URL || 'http://10.0.2.2:3000/api/v1' }}

jobs:
  test:
    name: Kiểm thử backend
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: teamapp_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U app" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Tìm thư mục dự án
        run: |
          f=$(find . -path '*/backend/package.json' -not -path '*/node_modules/*' | head -1)
          if [ -z "$f" ] && [ -n "$(find . -maxdepth 2 -name '*.zip' | head -1)" ]; then
            n=$(find . -maxdepth 2 -name '*.zip' | wc -l)
            if [ "$n" -gt 1 ]; then
              echo "::error::Repo có $n file .zip: $(find . -maxdepth 2 -name '*.zip' | tr '\n' ' ') — hãy xóa bản cũ, chỉ giữ 1 file source.zip"; exit 1
            fi
            z=$(find . -maxdepth 2 -name '*.zip' | head -1)
            echo "Giải nén $z"; unzip -q -o "$z" -d .
            f=$(find . -path '*/backend/package.json' -not -path '*/node_modules/*' | head -1)
          fi
          if [ -z "$f" ]; then echo "::error::Không tìm thấy backend/package.json trong repo"; exit 1; fi
          echo "APP_DIR=$(dirname "$(dirname "$f")")" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Cài đặt & kiểm thử
        working-directory: ${{ env.APP_DIR }}/backend
        env:
          TEST_DATABASE_URL: postgresql://app:app@localhost:5432/teamapp_test
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
          npx tsc -p tsconfig.json --noEmit
          npm test

  server:
    name: Build server + web (PWA)
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tìm thư mục dự án
        run: |
          f=$(find . -path '*/backend/package.json' -not -path '*/node_modules/*' | head -1)
          if [ -z "$f" ] && [ -n "$(find . -maxdepth 2 -name '*.zip' | head -1)" ]; then
            n=$(find . -maxdepth 2 -name '*.zip' | wc -l)
            if [ "$n" -gt 1 ]; then
              echo "::error::Repo có $n file .zip: $(find . -maxdepth 2 -name '*.zip' | tr '\n' ' ') — hãy xóa bản cũ, chỉ giữ 1 file source.zip"; exit 1
            fi
            z=$(find . -maxdepth 2 -name '*.zip' | head -1)
            echo "Giải nén $z"; unzip -q -o "$z" -d .
            f=$(find . -path '*/backend/package.json' -not -path '*/node_modules/*' | head -1)
          fi
          echo "APP_DIR=$(dirname "$(dirname "$f")")" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Build web (PWA, cùng origin với API)
        working-directory: ${{ env.APP_DIR }}/mobile-web
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
          npm run build
      - name: Build backend
        working-directory: ${{ env.APP_DIR }}/backend
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
          npm run build
      - name: Đóng gói
        working-directory: ${{ env.APP_DIR }}
        run: |
          mkdir -p out/backend out/mobile-web
          cp -r backend/dist backend/assets backend/package.json out/backend/
          cp backend/package-lock.json backend/.env.example out/backend/ 2>/dev/null || true
          cp -r mobile-web/dist out/mobile-web/
          cp README.md out/ 2>/dev/null || true
          printf '%s\n' \
            'Chạy server (cần Node 22 + PostgreSQL 16):' \
            '  cd backend' \
            '  npm install --omit=dev' \
            '  DATABASE_URL=postgresql://user:pass@host:5432/db JWT_SECRET=... node dist/main.js' \
            'Server tự tạo bảng (migrate) và phục vụ giao diện tại http://<host>:3000' > out/START.txt
      - uses: actions/upload-artifact@v4
        with:
          name: server-bundle
          path: ${{ env.APP_DIR }}/out/

  android:
    name: Build APK Android (Capacitor)
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tìm thư mục dự án
        run: |
          f=$(find . -path '*/backend/package.json' -not -path '*/node_modules/*' | head -1)
          if [ -z "$f" ] && [ -n "$(find . -maxdepth 2 -name '*.zip' | head -1)" ]; then
            n=$(find . -maxdepth 2 -name '*.zip' | wc -l)
            if [ "$n" -gt 1 ]; then
              echo "::error::Repo có $n file .zip: $(find . -maxdepth 2 -name '*.zip' | tr '\n' ' ') — hãy xóa bản cũ, chỉ giữ 1 file source.zip"; exit 1
            fi
            z=$(find . -maxdepth 2 -name '*.zip' | head -1)
            echo "Giải nén $z"; unzip -q -o "$z" -d .
            f=$(find . -path '*/backend/package.json' -not -path '*/node_modules/*' | head -1)
          fi
          echo "APP_DIR=$(dirname "$(dirname "$f")")" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Dùng Android SDK có sẵn trên runner
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKM=$(ls -d $ANDROID_HOME/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          yes | "$SDKM" --licenses > /dev/null || true
      - name: Build web trỏ tới API
        working-directory: ${{ env.APP_DIR }}/mobile-web
        env:
          VITE_API_URL: ${{ env.API_URL }}
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
          npm run build
      - name: Tạo/đồng bộ project Android
        working-directory: ${{ env.APP_DIR }}/mobile-web
        run: |
          if [ ! -d android ]; then npx cap add android; fi
          # Biểu tượng & màn hình khởi động Việc Đến
          cp -r resources/android/res/. android/app/src/main/res/
          # Quyền camera (quét gương mặt) và micro (ghi âm khai việc)
          M=android/app/src/main/AndroidManifest.xml
          for p in CAMERA RECORD_AUDIO MODIFY_AUDIO_SETTINGS; do
            grep -q "android.permission.$p\"" $M || sed -i "s#</manifest>#    <uses-permission android:name=\"android.permission.$p\" />\n</manifest>#" $M
          done
          npx cap sync android
      - name: Gradle assembleDebug
        working-directory: ${{ env.APP_DIR }}/mobile-web/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: ${{ env.APP_DIR }}/mobile-web/android/app/build/outputs/apk/debug/*.apk
